[project]
name = "mcp-server-life-guardian"
version = "0.1.0"
description = "A Model Context Protocol server exposing the AI 智慧管家 smart-community service platform to external agents"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "llm", "smart-community", "service-matching"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-server-life-guardian = "mcp_server_life_guardian:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_life_guardian"]
