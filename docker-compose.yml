services:
  db:
    image: postgres:15-alpine
    container_name: alg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alg_password}
      POSTGRES_DB: ${POSTGRES_DB:-alg_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-alg_user} -d ${POSTGRES_DB:-alg_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alg_backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: AI 智慧管家
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-alg_user}:${POSTGRES_PASSWORD:-alg_password}@db:5432/${POSTGRES_DB:-alg_db}
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

      # --- AI provider: "mock" (offline fixture) or "bedrock" (real LLM) ---
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      MOCK_AI_LATENCY_MS: ${MOCK_AI_LATENCY_MS:-600}

      # --- AWS / Amazon Bedrock -------------------------------------------
      # Values come from the .env file next to this compose file, or from the
      # shell environment. Never hardcode credentials here.
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-1500}
      BEDROCK_TEMPERATURE: ${BEDROCK_TEMPERATURE:-0.0}
      BEDROCK_READ_TIMEOUT_SECONDS: ${BEDROCK_READ_TIMEOUT_SECONDS:-45}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # Standard MCP server wrapping the REST API, for external agents.
  # Its own image on purpose: the MCP SDK needs a newer starlette than
  # FastAPI 0.115 allows, so it cannot share the backend's interpreter.
  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: alg_mcp
    restart: unless-stopped
    environment:
      LIFE_GUARDIAN_API_BASE_URL: http://backend:8000
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8081"
      # DNS-rebinding protection rejects anything not addressed to localhost
      # with a 421, so every hostname this is reached by must be listed.
      # Every Host header this server may legitimately receive. Add your own
      # public hostname here before exposing it, or the SDK answers 421.
      # localhost:8081 is the in-container address, used by health checks and
      # by anything sharing this container's network namespace.
      MCP_ALLOWED_HOSTS: localhost,localhost:8010,localhost:8081,127.0.0.1,127.0.0.1:8010,127.0.0.1:8081,mcp,mcp:8081
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
    ports:
      # Published on 8010, not 8081: on Windows with Hyper-V, 8034-8333 sits in
      # a reserved excluded port range and binding 8081 fails outright. The
      # container still listens on 8081 internally.
      - "8010:8081"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alg_frontend
    restart: unless-stopped
    environment:
      # Browser-side fetch, so it must point where the browser can reach.
      # Defaults to localhost for local compose; override via .env or shell
      # when deploying (e.g., NEXT_PUBLIC_API_BASE_URL=https://api.yourdomain.com).
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
