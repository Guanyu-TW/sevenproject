services:
  db:
    image: postgres:15-alpine
    container_name: alg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alg_password}
      POSTGRES_DB: ${POSTGRES_DB:-alg_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-alg_user} -d ${POSTGRES_DB:-alg_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alg_backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: AI Life Guardian
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-alg_user}:${POSTGRES_PASSWORD:-alg_password}@db:5432/${POSTGRES_DB:-alg_db}
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

      # --- AI provider: "mock" (offline fixture) or "bedrock" (real LLM) ---
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      MOCK_AI_LATENCY_MS: ${MOCK_AI_LATENCY_MS:-600}

      # --- AWS / Amazon Bedrock -------------------------------------------
      # Values come from the .env file next to this compose file, or from the
      # shell environment. Never hardcode credentials here.
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-1500}
      BEDROCK_TEMPERATURE: ${BEDROCK_TEMPERATURE:-0.0}
      BEDROCK_READ_TIMEOUT_SECONDS: ${BEDROCK_READ_TIMEOUT_SECONDS:-45}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alg_frontend
    restart: unless-stopped
    environment:
      # Browser-side fetch, so it must point at the host-exposed backend port.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
